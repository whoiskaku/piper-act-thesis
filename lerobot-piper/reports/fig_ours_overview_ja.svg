  <line x1="386" y1="486" x2="409" y2="486" stroke="#1f2d4d" stroke-width="1.4" marker-start="url(#ahk)" marker-end="url(#ahk)"/>
  <text x="397" y="480" text-anchor="middle" class="s">遅れ</text>
  <text x="295" y="571" text-anchor="middle" class="note">チャンク境界</text>
  <line x1="452" y1="508" x2="476" y2="508" stroke="#2b4c7e" stroke-width="2.2"/>
  <text x="482" y="512" class="s">実際 <tspan class="i">ω</tspan></text>
  <line x1="452" y1="530" x2="476" y2="530" stroke="#d6405f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="482" y="534" class="s">理想 <tspan class="i">ω*</tspan></text>

  <!-- 記号と注記 -->
  <text x="600" y="500" class="s"><tspan class="i">u</tspan>：ACT の指令　<tspan class="i">δa</tspan>：補正量　<tspan class="i">ω</tspan>：IMU 実測値　<tspan class="i">ω̂</tspan>：G の予測　<tspan class="i">ω*</tspan>：理想（<tspan class="i">u</tspan> から計算）</text>
  <text x="600" y="526" class="s" font-weight="700" fill="#b23c17">⚠ 数値はすべて旧作業台での測定。新作業台で再測定が必要。</text>
</svg>
