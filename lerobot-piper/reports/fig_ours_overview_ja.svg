<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <!-- 日本語版（簡潔版）草稿：APEX 図1上半分にならい、本研究の手法（pi-g2env-v1、FF なし）を描く。数値はすべて旧作業台のもの。 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#1d8fbf"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#d6405f"/>
    </marker>
    <marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#1f2d4d"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'DejaVu Sans', Arial, 'Noto Sans CJK JP', 'Source Han Sans JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif; fill: #1f2d4d; }
    .t { font-size: 15px; font-weight: 700; }
    .m { font-size: 13px; }
    .s { font-size: 12px; }
    .i { font-style: italic; }
    .note { font-size: 11.5px; fill: #5b6b80; }
    .box { fill: #def0f7; stroke: #1d8fbf; stroke-width: 2.5; }
    .learn { fill: #fbe9ee; stroke: #d6405f; stroke-width: 2.5; }
    .wire { fill: none; stroke: #1d8fbf; stroke-width: 2.4; }
    .bp { fill: none; stroke: #d6405f; stroke-width: 2.2; stroke-dasharray: 8 5; }
    .inset { fill: #ffffff; stroke: #1d8fbf; stroke-width: 2; stroke-dasharray: 7 4; }
    .node { fill: #ffffff; stroke: #1f2d4d; stroke-width: 2.4; }
  </style>

  <rect width="1600" height="600" fill="#ffffff"/>
  <rect x="88" y="14" width="1500" height="572" rx="28" fill="#f6fafc" stroke="#1d8fbf" stroke-width="4" stroke-dasharray="16 10"/>
  <text transform="translate(42,300) rotate(-90)" text-anchor="middle" font-size="25" font-weight="700">本研究</text>
  <text transform="translate(72,300) rotate(-90)" text-anchor="middle" font-size="25">IMU を用いた実行補正</text>

  <!-- 行ラベル -->
  <text x="108" y="114" class="m" font-weight="700" fill="#1d8fbf">① シミュレータで学習</text>
  <text x="108" y="376" class="m" font-weight="700" fill="#1d8fbf">② 実機で実行</text>

  <!-- ACT 方策 -->
  <text x="180" y="192" text-anchor="middle" class="t">ACT 方策</text>
  <g stroke="#1f2d4d" stroke-width="1.6">
    <line x1="150" y1="226" x2="180" y2="214"/><line x1="150" y1="226" x2="180" y2="241"/><line x1="150" y1="226" x2="180" y2="268"/>
    <line x1="150" y1="256" x2="180" y2="214"/><line x1="150" y1="256" x2="180" y2="241"/><line x1="150" y1="256" x2="180" y2="268"/>
    <line x1="180" y1="214" x2="210" y2="226"/><line x1="180" y1="241" x2="210" y2="226"/><line x1="180" y1="268" x2="210" y2="226"/>
    <line x1="180" y1="214" x2="210" y2="256"/><line x1="180" y1="241" x2="210" y2="256"/><line x1="180" y1="268" x2="210" y2="256"/>
  </g>
  <g fill="#1f2d4d">
    <circle cx="150" cy="226" r="8"/><circle cx="150" cy="256" r="8"/>
    <circle cx="180" cy="214" r="8"/><circle cx="180" cy="241" r="8"/><circle cx="180" cy="268" r="8"/>
    <circle cx="210" cy="226" r="8"/><circle cx="210" cy="256" r="8"/>
  </g>

  <!-- 指令 u のバス -->
  <path class="wire" d="M222,241 H285"/>
  <text x="253" y="233" text-anchor="middle" class="m i">u</text>
  <path class="wire" d="M285,110 V372"/>
  <circle cx="285" cy="241" r="4.5" fill="#1d8fbf"/>
  <circle cx="285" cy="282" r="4.5" fill="#1d8fbf"/>
  <path class="wire" d="M285,170 H900 V198" marker-end="url(#ah)"/>
  <path class="wire" d="M650,170 V144" marker-end="url(#ah)"/>
  <circle cx="285" cy="170" r="4.5" fill="#1d8fbf"/>
  <circle cx="650" cy="170" r="4.5" fill="#1d8fbf"/>
  <text x="520" y="163" text-anchor="middle" class="m i">u</text>
  <path class="wire" d="M285,110 H328" marker-end="url(#ah)"/>
  <path class="wire" d="M285,282 H328" marker-end="url(#ah)"/>
  <path class="wire" d="M285,372 H411" marker-end="url(#ah)"/>
  <text x="350" y="364" text-anchor="middle" class="m i">u</text>

  <!-- ① シミュレータで学習 -->
  <rect class="learn" x="330" y="78" width="200" height="64" rx="12"/>
  <text x="430" y="104" text-anchor="middle" class="t">補正ネットワーク π<tspan dy="4" font-size="11">θ</tspan></text>
  <text x="430" y="127" text-anchor="middle" class="m">出力 <tspan class="i">δa</tspan>（≤ 10 mrad）</text>
  <path class="wire" d="M530,110 H598" marker-end="url(#ah)"/>
  <text x="564" y="101" text-anchor="middle" class="m i">δa</text>

  <rect class="box" x="600" y="78" width="260" height="64" rx="12"/>
  <text x="730" y="104" text-anchor="middle" class="t">G シミュレータ（固定）</text>
  <text x="730" y="127" text-anchor="middle" class="m i">u + δa → ω̂</text>
  <path class="wire" d="M860,110 H917" marker-end="url(#ah)"/>
  <text x="888" y="101" text-anchor="middle" class="m i">ω̂</text>
  <circle class="node" cx="936" cy="110" r="17"/>
  <line x1="927" y1="110" x2="945" y2="110" stroke="#1f2d4d" stroke-width="3"/>
  <path class="wire" d="M953,110 H988" marker-end="url(#ah)"/>

  <rect class="box" x="990" y="78" width="240" height="64" rx="12"/>
  <text x="1110" y="104" text-anchor="middle" class="t">損失</text>
  <text x="1110" y="127" text-anchor="middle" class="m"><tspan class="i">‖ω̂ − ω*‖²</tspan></text>

  <path class="bp" d="M1110,78 V40 H480 V74" marker-end="url(#ahr)"/>
  <text x="795" y="58" text-anchor="middle" class="s i" fill="#d6405f">損失で π を更新</text>

  <!-- シミュレーション → 実機 -->
  <path d="M417,146 H443 V226 H458 L430,250 L402,226 H417 Z" fill="#cfe9f5" stroke="#1d8fbf" stroke-width="2"/>
  <text x="468" y="196" class="m" font-weight="700">シミュレーション → 実機</text>
  <text x="468" y="214" class="s">パラメータを固定して移す</text>

  <!-- シミュレーション（理想） -->
  <rect class="box" x="868" y="200" width="214" height="60" rx="12"/>
  <text x="975" y="225" text-anchor="middle" class="t">シミュレーション（理想）</text>
  <text x="975" y="247" text-anchor="middle" class="m"><tspan class="i">ω*</tspan> = 剛体運動学(<tspan class="i">u</tspan>)</text>
  <path class="wire" d="M936,200 V129" marker-end="url(#ah)"/>
  <text x="946" y="172" class="m i">ω*</text>
  <path class="wire" d="M1020,260 V353" marker-end="url(#ah)"/>
  <text x="1030" y="312" class="m i">ω*</text>

  <!-- ② 実機で実行 -->
  <rect class="learn" x="330" y="252" width="200" height="60" rx="12"/>
  <text x="430" y="278" text-anchor="middle" class="t">補正ネットワーク π<tspan dy="4" font-size="11">θ</tspan></text>
  <text x="430" y="300" text-anchor="middle" class="m">パラメータ固定</text>
  <path class="wire" d="M430,312 V353" marker-end="url(#ah)"/>
  <text x="442" y="338" class="m i">δa</text>

  <circle class="node" cx="430" cy="372" r="17"/>
  <line x1="421" y1="372" x2="439" y2="372" stroke="#1f2d4d" stroke-width="3"/>
  <line x1="430" y1="363" x2="430" y2="381" stroke="#1f2d4d" stroke-width="3"/>
  <path class="wire" d="M447,372 H668" marker-end="url(#ah)"/>
  <text x="557" y="364" text-anchor="middle" class="m i">u + δa</text>

  <rect class="box" x="670" y="340" width="180" height="64" rx="12"/>
  <text x="760" y="366" text-anchor="middle" class="t">Piper コントローラ</text>
  <text x="760" y="389" text-anchor="middle" class="m">ブラックボックス</text>
  <path class="wire" d="M850,372 H872" marker-end="url(#ah)"/>

  <!-- アームのアイコン -->
  <g transform="translate(-33,-30)">
    <g fill="#1f2d4d" stroke="#1f2d4d">
      <rect x="912" y="436" width="46" height="12" rx="2" stroke="none"/>
      <rect x="922" y="420" width="26" height="18" rx="3" stroke="none"/>
      <line x1="935" y1="420" x2="935" y2="386" stroke-width="12" stroke-linecap="round"/>
      <line x1="935" y1="386" x2="968" y2="368" stroke-width="10" stroke-linecap="round"/>
      <line x1="968" y1="368" x2="977" y2="386" stroke-width="8" stroke-linecap="round"/>
      <line x1="971" y1="389" x2="969" y2="399" stroke-width="4" stroke-linecap="round"/>
      <line x1="983" y1="387" x2="986" y2="396" stroke-width="4" stroke-linecap="round"/>
      <circle cx="935" cy="386" r="9" stroke="none"/>
      <circle cx="968" cy="368" r="7" stroke="none"/>
    </g>
    <circle cx="935" cy="386" r="3.5" fill="#ffffff"/>
    <rect x="972" y="370" width="10" height="10" fill="#1d8fbf" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <text x="917" y="432" text-anchor="middle" class="note">アーム + 手首 IMU</text>

  <path class="wire" d="M962,372 H1001" marker-end="url(#ah)"/>
  <text x="981" y="364" text-anchor="middle" class="m i">ω</text>
  <circle class="node" cx="1020" cy="372" r="17"/>
  <line x1="1011" y1="372" x2="1029" y2="372" stroke="#1f2d4d" stroke-width="3"/>
  <path class="wire" d="M1037,372 H1068" marker-end="url(#ah)"/>

  <rect class="box" x="1070" y="340" width="160" height="64" rx="12"/>
  <text x="1150" y="366" text-anchor="middle" class="t">評価</text>
  <text x="1150" y="389" text-anchor="middle" class="m">実際の動作 vs 指令</text>

  <!-- 右側：結果（IMU 偏差の変化、負ほど良い） -->
  <rect class="inset" x="1262" y="60" width="310" height="100" rx="6"/>
  <text x="1276" y="84" class="m" font-weight="700">シミュレーション内（G、未学習データ）</text>
  <line x1="1470" y1="96" x2="1470" y2="146" stroke="#1f2d4d" stroke-width="1.5"/>
  <text x="1276" y="126" class="s">π</text>
  <rect x="1441.6" y="114" width="28.4" height="16" fill="#607d8b"/>
  <text x="1476" y="127" class="s">−15.8%</text>
  <text x="1276" y="152" class="note">← 良い</text>

  <rect class="inset" x="1262" y="318" width="310" height="100" rx="6"/>
  <text x="1276" y="342" class="m" font-weight="700">実機（補正なし ACT 比）</text>
  <line x1="1470" y1="354" x2="1470" y2="404" stroke="#1f2d4d" stroke-width="1.5"/>
  <text x="1276" y="384" class="s">π</text>
  <rect x="1470" y="372" width="45" height="16" fill="#c62828"/>
  <text x="1464" y="385" text-anchor="end" class="s">+25.0%</text>
  <text x="1276" y="410" class="note">← 良い</text>

  <!-- 左下：問題の模式図 -->
  <rect class="inset" x="104" y="444" width="462" height="132" rx="6"/>
  <text x="118" y="463" class="m" font-weight="700">補正なしの場合（模式図）</text>
  <line x1="295.1" y1="472" x2="295.1" y2="558" stroke="#8a97a8" stroke-width="1.3" stroke-dasharray="3 3"/>
